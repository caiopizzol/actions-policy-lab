name: annotate-probe
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  probe:
    name: annotate probe
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice title=test-integrity-result::base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }} verdict=pass"
