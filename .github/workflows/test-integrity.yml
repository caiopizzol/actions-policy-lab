name: Test integrity
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
  checks: read
concurrency:
  group: test-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test-integrity:
    name: Test integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: caiopizzol/skills/.github/actions/test-integrity@4c65fffc39b6e8f07f33d9be7046e5a9ab177180
