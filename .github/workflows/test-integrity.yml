name: Test integrity
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: test-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test-integrity:
    name: Test integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: caiopizzol/skills/.github/actions/test-integrity@5d33672bfae7e40a08fe63cf87d2fd0747515a1f
