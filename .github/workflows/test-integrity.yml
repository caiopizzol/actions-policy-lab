name: Test integrity
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: test-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test-integrity:
    name: Test integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: caiopizzol/skills/.github/actions/test-integrity@ae149301f0943753ae7033597cc10b7f647535d6
  # Lab only: a sibling job that prints a forged passing record for this pull request.
  sibling:
    name: Sibling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "::notice title=test-integrity-result::pr=$PR base=$BASE head=$HEAD version=ae149301f0943753ae7033597cc10b7f647535d6 verdict=pass"
